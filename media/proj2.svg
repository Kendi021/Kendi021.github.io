<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" role="img"
     aria-label="Schéma d'un domaine Active Directory : contrôleur de domaine, unités d'organisation et utilisateurs">
  <defs>
    <linearGradient id="ad-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1320"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="ad-acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b77ff"/>
      <stop offset="1" stop-color="#00c2ff"/>
    </linearGradient>
    <radialGradient id="ad-glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#2b77ff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#2b77ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="ad-dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#7ea3cc" opacity="0.10"/>
    </pattern>
  </defs>

  <!-- Fond + ambiance -->
  <rect width="600" height="420" fill="url(#ad-bg)"/>
  <rect width="600" height="420" fill="url(#ad-dots)"/>
  <ellipse cx="300" cy="150" rx="240" ry="150" fill="url(#ad-glow)"/>

  <!-- Liaisons (derrière les noeuds) -->
  <g stroke="url(#ad-acc)" stroke-width="2" fill="none" opacity="0.55" stroke-linecap="round">
    <path d="M300 150 V196"/>
    <path d="M300 196 H150 M150 196 V232"/>
    <path d="M300 196 V232"/>
    <path d="M300 196 H450 M450 196 V232"/>
    <!-- vers utilisateurs -->
    <path d="M150 300 V330 M124 330 H176"/>
    <path d="M300 300 V330 M274 330 H326"/>
    <path d="M450 300 V330 M424 330 H476"/>
  </g>

  <!-- Contrôleur de domaine -->
  <g>
    <rect x="238" y="66" width="124" height="84" rx="14" fill="#111c2c" stroke="url(#ad-acc)" stroke-width="2"/>
    <rect x="256" y="84" width="88" height="11" rx="5.5" fill="#2b77ff" opacity="0.55"/>
    <rect x="256" y="103" width="88" height="11" rx="5.5" fill="#00c2ff" opacity="0.55"/>
    <circle cx="262" cy="132" r="4.5" fill="#1de4a3"/>
    <circle cx="278" cy="132" r="4.5" fill="#1de4a3" opacity="0.6"/>
    <text x="338" y="137" text-anchor="end" font-family="'JetBrains Mono',monospace"
          font-size="13" font-weight="700" fill="#cfe6ff">DC</text>
  </g>
  <text x="300" y="172" text-anchor="middle" font-family="'JetBrains Mono',monospace"
        font-size="13" fill="#9ab0c9">SRV-AD01</text>

  <!-- Unités d'organisation -->
  <g font-family="'JetBrains Mono',monospace" font-size="13" fill="#cfe6ff" text-anchor="middle">
    <!-- OU RH -->
    <g>
      <rect x="98" y="236" width="104" height="64" rx="12" fill="#0d1524" stroke="#2b77ff" stroke-width="1.5" opacity="0.95"/>
      <circle cx="150" cy="262" r="9" fill="none" stroke="url(#ad-acc)" stroke-width="2"/>
      <path d="M138 282 q12 -14 24 0" fill="none" stroke="url(#ad-acc)" stroke-width="2"/>
      <text x="150" y="296" font-size="11" fill="#9ab0c9">OU · RH</text>
    </g>
    <!-- OU IT -->
    <g>
      <rect x="248" y="236" width="104" height="64" rx="12" fill="#0d1524" stroke="#00c2ff" stroke-width="1.5"/>
      <circle cx="300" cy="262" r="9" fill="none" stroke="url(#ad-acc)" stroke-width="2"/>
      <path d="M288 282 q12 -14 24 0" fill="none" stroke="url(#ad-acc)" stroke-width="2"/>
      <text x="300" y="296" font-size="11" fill="#9ab0c9">OU · IT</text>
    </g>
    <!-- OU Direction -->
    <g>
      <rect x="398" y="236" width="104" height="64" rx="12" fill="#0d1524" stroke="#1de4a3" stroke-width="1.5" opacity="0.95"/>
      <circle cx="450" cy="262" r="9" fill="none" stroke="url(#ad-acc)" stroke-width="2"/>
      <path d="M438 282 q12 -14 24 0" fill="none" stroke="url(#ad-acc)" stroke-width="2"/>
      <text x="450" y="296" font-size="11" fill="#9ab0c9">OU · Dir.</text>
    </g>
  </g>

  <!-- Utilisateurs -->
  <g fill="#0b1220" stroke="url(#ad-acc)" stroke-width="2">
    <circle cx="150" cy="342" r="12"/>
    <circle cx="300" cy="342" r="12"/>
    <circle cx="450" cy="342" r="12"/>
  </g>
  <g fill="#8cdcff">
    <circle cx="150" cy="338" r="3.4"/><path d="M144 350 q6 -7 12 0" fill="none" stroke="#8cdcff" stroke-width="2"/>
    <circle cx="300" cy="338" r="3.4"/><path d="M294 350 q6 -7 12 0" fill="none" stroke="#8cdcff" stroke-width="2"/>
    <circle cx="450" cy="338" r="3.4"/><path d="M444 350 q6 -7 12 0" fill="none" stroke="#8cdcff" stroke-width="2"/>
  </g>

  <!-- Domaine -->
  <text x="300" y="398" text-anchor="middle" font-family="'JetBrains Mono',monospace"
        font-size="16" letter-spacing="1" fill="#00c2ff" opacity="0.9">ent-bts.local</text>
</svg>
