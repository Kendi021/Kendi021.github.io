<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" role="img"
     aria-label="Schéma d'un VPN sécurisé : poste client relié à un serveur OpenVPN par un tunnel chiffré">
  <defs>
    <linearGradient id="vpn-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1320"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="vpn-acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2b77ff"/>
      <stop offset="1" stop-color="#00c2ff"/>
    </linearGradient>
    <linearGradient id="vpn-tube" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2b77ff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#1de4a3" stop-opacity="0.18"/>
    </linearGradient>
    <radialGradient id="vpn-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1de4a3" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#1de4a3" stop-opacity="0"/>
    </radialGradient>
    <pattern id="vpn-dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#7ea3cc" opacity="0.10"/>
    </pattern>
  </defs>

  <!-- Fond + ambiance -->
  <rect width="600" height="420" fill="url(#vpn-bg)"/>
  <rect width="600" height="420" fill="url(#vpn-dots)"/>
  <ellipse cx="300" cy="205" rx="170" ry="120" fill="url(#vpn-glow)"/>

  <!-- Tunnel chiffré -->
  <rect x="196" y="183" width="208" height="44" rx="22" fill="url(#vpn-tube)"
        stroke="url(#vpn-acc)" stroke-width="2"/>
  <line x1="214" y1="205" x2="386" y2="205" stroke="url(#vpn-acc)" stroke-width="2.5"
        stroke-dasharray="3 11" stroke-linecap="round" opacity="0.85"/>
  <g fill="#8cdcff">
    <circle cx="232" cy="205" r="3"/><circle cx="262" cy="205" r="3" opacity="0.8"/>
    <circle cx="338" cy="205" r="3" opacity="0.8"/><circle cx="368" cy="205" r="3"/>
  </g>

  <!-- Poste client (gauche) -->
  <g>
    <rect x="64" y="158" width="120" height="80" rx="10" fill="#0d1524" stroke="url(#vpn-acc)" stroke-width="2"/>
    <rect x="76" y="170" width="96" height="56" rx="6" fill="#0a1320"/>
    <!-- petit cadenas dans l'écran -->
    <rect x="114" y="196" width="20" height="16" rx="3" fill="url(#vpn-acc)"/>
    <path d="M117 196 v-4 a7 7 0 0 1 14 0 v4" fill="none" stroke="#8cdcff" stroke-width="2.5"/>
    <!-- socle du portable -->
    <path d="M50 250 H198 L208 266 H40 Z" fill="#111c2c" stroke="url(#vpn-acc)" stroke-width="1.5"/>
    <text x="124" y="290" text-anchor="middle" font-family="'JetBrains Mono',monospace"
          font-size="13" fill="#9ab0c9">client-admin</text>
  </g>

  <!-- Serveur OpenVPN (droite) -->
  <g>
    <rect x="416" y="150" width="120" height="96" rx="12" fill="#0d1524" stroke="url(#vpn-acc)" stroke-width="2"/>
    <rect x="432" y="168" width="76" height="11" rx="5.5" fill="#2b77ff" opacity="0.55"/>
    <rect x="432" y="187" width="76" height="11" rx="5.5" fill="#00c2ff" opacity="0.55"/>
    <circle cx="438" cy="222" r="4.5" fill="#1de4a3"/>
    <circle cx="454" cy="222" r="4.5" fill="#1de4a3" opacity="0.55"/>
    <text x="508" y="227" text-anchor="end" font-family="'JetBrains Mono',monospace"
          font-size="12" font-weight="700" fill="#cfe6ff">VPN</text>
    <text x="476" y="290" text-anchor="middle" font-family="'JetBrains Mono',monospace"
          font-size="13" fill="#9ab0c9">vpn-server</text>
  </g>

  <!-- Cadenas central (élément clé : chiffrement) -->
  <g>
    <circle cx="300" cy="205" r="33" fill="#0b1220" stroke="url(#vpn-acc)" stroke-width="2.5"/>
    <rect x="285" y="203" width="30" height="24" rx="5" fill="url(#vpn-acc)"/>
    <path d="M289 203 v-7 a11 11 0 0 1 22 0 v7" fill="none" stroke="#cfe6ff" stroke-width="3"/>
    <circle cx="300" cy="213" r="3.4" fill="#06121f"/>
    <rect x="298.5" y="214" width="3" height="7" rx="1.5" fill="#06121f"/>
  </g>

  <!-- Étiquettes -->
  <g font-family="'JetBrains Mono',monospace" text-anchor="middle">
    <rect x="252" y="146" width="96" height="24" rx="12" fill="rgba(0,194,255,0.12)" stroke="#00c2ff" stroke-opacity="0.4"/>
    <text x="300" y="162" font-size="12" letter-spacing="1" fill="#8cdcff">UDP · 1194</text>
    <text x="300" y="392" font-size="16" letter-spacing="1" fill="#1de4a3" opacity="0.9">tunnel chiffré · AES-256-GCM</text>
  </g>
</svg>
